name: mdr-reuse

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mdr
      POSTGRES_USER: mdr
      POSTGRES_PASSWORD: mdr
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=64MB
    mem_limit: 160m
    cpus: 1.0
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdr -d mdr"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mdr
      DB_USER: mdr
      DB_PASSWORD: mdr
    mem_limit: 224m
    cpus: 1.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./review:/app/review
      - ./docs:/app/docs
      - ./manage.py:/app/manage.py

volumes:
  pgdata:
