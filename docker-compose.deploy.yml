services:
  db:
    ports: !override
      - "127.0.0.1:55434:5432"
    restart: unless-stopped

  web:
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
    ports: !override
      - "127.0.0.1:8800:8000"
    restart: unless-stopped
    environment:
      DEBUG: "0"
      SECURE: "0"
      TRUST_PROXY: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-lcdtofbmdr.nirovia.in,lcgtofbmdr.nirovia.in,lcgtomsrd.nirovia.in,127.0.0.1,localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://lcdtofbmdr.nirovia.in,https://lcgtofbmdr.nirovia.in,https://lcgtomsrd.nirovia.in}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD}
    networks:
      default: {}
      nirovia_prod_net:
        aliases:
          - lcdtofbmdr_web

networks:
  nirovia_prod_net:
    external: true
    name: nirovia_prod_nirovia_prod_net
